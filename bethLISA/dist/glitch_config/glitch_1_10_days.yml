t_inj: [30000]
beta: [1]
level: [1e-20]
glitch_shape: "OneSidedDoubleExpGlitch"
t_rise: 5
t_fall: 10
duration: 864000 # 10 days = 864000 seconds
_command: |
  args=(                                            
    --glitch_cfg_input      glitch_1_10_days.yml
    --glitch_output_h5      glitch_1_10_days.h5
    --glitch_output_txt     glitch_1_10_days.txt
    --tdi_output_h5         glitch_1_10_days.h5
    --simulation_output_h5  glitch_1_10_days.h5
    --pipe_cfg_input        pipeline_cfg.yml
    --orbit_input_h5        orbits.h5
    --disable_noise   False
  )
  python main.py "${args[@]}"